<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Energy System - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-circle">⚡</div>
      <h1>Smart Energy System</h1>
      <p>Monitoring, Prediction & Recommendation</p>
    </div>
    <div class="login-form">
      <h2>Sign In</h2>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" id="loginUser" placeholder="Enter username" value="admin">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" id="loginPass" placeholder="Enter password" value="admin123">
      </div>
      <div id="loginError" style="color:var(--accent-red);font-size:12px;margin-bottom:10px;display:none;">Invalid username or password.</div>
      <button class="btn btn-primary w-full" onclick="doLogin()" style="width:100%;justify-content:center;">Sign In</button>
      <div class="login-footer">Default: admin / admin123</div>
    </div>
  </div>
</div>
<script>
function doLogin() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  // Simple client-side check for demo
  if (user === 'admin' && pass === 'admin123') {
    localStorage.setItem('sem_logged_in', '1');
    localStorage.setItem('sem_user', 'Admin');
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
